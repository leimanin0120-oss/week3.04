<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玩具美食評分 - Toy Story Food Rating</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* Base Style Extensions */
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #73C2FB;
        background-image: 
          radial-gradient(circle at 20% 30%, white 0%, white 5%, transparent 10%),
          radial-gradient(circle at 25% 35%, white 0%, white 8%, transparent 15%),
          radial-gradient(circle at 30% 30%, white 0%, white 5%, transparent 10%),
          radial-gradient(circle at 70% 60%, white 0%, white 5%, transparent 10%),
          radial-gradient(circle at 75% 65%, white 0%, white 8%, transparent 15%),
          radial-gradient(circle at 80% 60%, white 0%, white 5%, transparent 10%);
        background-size: 400px 400px;
        background-attachment: fixed;
        min-height: 100vh;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Cow Print Pattern for Woody */
      .cow-print {
        background-color: white;
        background-image: 
          radial-gradient(circle at 20% 20%, #222 0%, #222 10%, transparent 15%),
          radial-gradient(circle at 80% 40%, #222 0%, #222 12%, transparent 18%),
          radial-gradient(circle at 40% 70%, #222 0%, #222 8%, transparent 12%),
          radial-gradient(circle at 70% 80%, #222 0%, #222 10%, transparent 15%);
        background-size: 100px 100px;
      }

      /* Buzz Space Pattern */
      .buzz-space {
        background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        position: relative;
      }
      .buzz-space::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at center, #a855f7 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.3;
      }

      /* Toy Story Font Style */
      .font-toy {
        font-family: 'Space Grotesk', 'Arial Black', sans-serif;
        font-weight: 900;
        text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #73C2FB;
      }

      ::-webkit-scrollbar-thumb {
        background: #FDE047; /* Woody Yellow */
        border: 2px solid #73C2FB;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #EAB308;
      }
    </style>
  </head>
  <body class="text-blue-900 selection:bg-yellow-400/30">
    <div id="app" class="min-h-screen flex flex-col">
      <!-- Header -->
      <header class="sticky top-0 z-50 bg-white border-b-4 border-yellow-400 shadow-md">
        <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between relative z-50">
          <div class="flex items-center gap-2">
            <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-lg border-2 border-red-500 overflow-hidden relative">
              <div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #EF4444 10px, #EF4444 11px);"></div>
              <i data-lucide="utensils" class="text-red-600 w-7 h-7 relative z-10"></i>
            </div>
            <div>
              <h1 class="text-2xl font-toy text-yellow-400 tracking-wider">玩具美食評分</h1>
              <p class="text-[10px] text-blue-800 font-black uppercase tracking-[0.2em]">Toy Story Food Rating</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button 
              id="tab-toggle-btn"
              onclick="toggleTab()"
              class="px-4 py-2 rounded-xl buzz-space text-white text-xs font-black border-b-4 border-purple-900 hover:brightness-110 transition-all active:translate-y-1 active:border-b-0 shadow-lg overflow-hidden cursor-pointer"
            >
              <span id="tab-toggle-text" class="relative z-10">🚀 飛向排行榜</span>
            </button>
          </div>
        </div>

        <!-- Filter Sub-Header -->
        <div id="filters-container" class="max-w-2xl mx-auto px-4 pb-4 space-y-3 relative z-50">
          <!-- Meal Type Filters -->
          <div class="overflow-x-auto no-scrollbar">
            <div id="category-filters" class="flex gap-2 py-1">
              <!-- Rendered Dynamically -->
            </div>
          </div>

          <!-- Status Filters -->
          <div class="flex gap-2 py-1 border-t-2 border-blue-50 pt-3 items-center">
            <span class="text-[10px] font-black text-blue-300 uppercase tracking-widest mr-1">Status:</span>
            <div id="status-filters" class="flex gap-2">
              <!-- Rendered Dynamically -->
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content Container -->
      <main class="max-w-2xl mx-auto px-4 py-6 pb-24 relative z-10 w-full flex-grow">
        <!-- New Review Form Layer -->
        <div id="form-container" class="mb-8 relative z-20">
          <form id="review-form" onsubmit="handleFormSubmit(event)" class="bg-white border-8 border-yellow-400 rounded-[2.5rem] p-8 space-y-6 shadow-[0_20px_50px_rgba(0,0,0,0.2)] relative overflow-hidden">
            <!-- Cow pattern accent -->
            <div class="absolute -top-10 -right-10 w-40 h-40 cow-print opacity-20 rotate-12 rounded-full border-4 border-black pointer-events-none"></div>
            
            <div class="flex items-center gap-3 mb-2">
               <div class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center border-b-4 border-red-700">
                  <i data-lucide="message-square" class="text-white w-5 h-5"></i>
               </div>
               <h2 class="text-xl font-toy text-blue-900 tracking-tight">新增你的冒險食評！</h2>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">你的冒險心得</label>
              <textarea
                id="form-content"
                placeholder="這頓飯太好吃了！就像飛向宇宙，浩瀚無垠！"
                class="w-full bg-blue-50/50 border-4 border-blue-100 rounded-3xl p-5 text-base focus:ring-8 focus:ring-yellow-400/30 min-h-[120px] resize-none placeholder:text-blue-200 text-blue-900 outline-none transition-all font-medium"
                required
              ></textarea>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">捕捉美味瞬間 (圖片網址)</label>
              <div class="relative">
                <input
                  type="url"
                  id="form-image"
                  placeholder="https://example.com/food.jpg"
                  class="w-full bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-5 py-4 text-sm focus:ring-8 focus:ring-yellow-400/30 text-blue-900 outline-none transition-all"
                />
                <i data-lucide="plus" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-lime-500 opacity-50"></i>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">任務分類</label>
                <div class="relative">
                  <select
                    id="form-category"
                    class="w-full bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-5 py-4 text-sm appearance-none focus:ring-8 focus:ring-yellow-400/30 text-blue-900 outline-none font-black"
                  >
                    <!-- Populated dynamically -->
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-500 pointer-events-none"></i>
                </div>
              </div>
              <div class="space-y-2">
                <label class="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">星級評價</label>
                <div class="flex items-center justify-around bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-4 py-3">
                  <div id="star-picker" class="flex gap-2">
                    <!-- Loaded dynamically -->
                  </div>
                </div>
              </div>
            </div>

            <button
              type="submit"
              id="submit-btn"
              class="w-full bg-red-500 hover:bg-red-400 disabled:opacity-50 text-white font-black text-lg py-5 rounded-3xl flex items-center justify-center gap-3 transition-all border-b-[6px] border-red-700 active:translate-y-1 active:border-b-0 shadow-[0_10px_20px_rgba(239,68,68,0.3)] group cursor-pointer"
            >
              <i data-lucide="send" class="w-6 h-6 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
              <span>發布食評！(飛向宇宙！)</span>
            </button>

            <!-- Success notification layer -->
            <div id="success-banner" class="hidden bg-lime-100 border-4 border-lime-500 text-lime-700 p-4 rounded-2xl flex items-center gap-3 font-black text-sm transition-all">
              <div class="w-8 h-8 bg-lime-500 rounded-full flex items-center justify-center text-white shrink-0">✓</div>
              任務成功！食評已永久保存在安仔的客房中！🚀
            </div>
          </form>
        </div>

        <!-- Feed List container (Active + Done + Empty state) -->
        <div id="feed-container" class="space-y-6 relative z-10">
          <!-- Populated by renderList() -->
        </div>

        <!-- Leaderboard (Hidden by default) -->
        <div id="leaderboard-container" class="space-y-4 hidden">
          <!-- Populated by renderList() -->
        </div>
      </main>
    </div>

    <!-- App Implementation Code -->
    <script>
      // ========================
      // Google Sheets 同步設定
      // ========================
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAes8IQa6R8-miSNkarhgzuUL9kLQhmJtnlW5yw9dpgz_wDOyZzoIARo2ps9EPftYN/exec";

      /**
       * 將資料同步至 Google Sheet（fire-and-forget）
       * @param {Object} payload - { action, record, id, changes }
       */
      function syncToSheet(payload) {
        // 如果尚未填入真實網址，則不發送
        if (APPS_SCRIPT_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE") return;
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        }).catch(err => console.warn('Google Sheets sync failed:', err));
      }

      // ========================
      // 原始應用程式碼（保持不變）
      // ========================

      // Global States
      let records = [];
      const CATEGORIES = ['早餐', '午餐', '下午茶', '晚餐', '其他'];
      let currentCategoryFilter = '全部';
      let currentStatusFilter = '全部';
      let activeTab = 'feed'; // 'feed' | 'leaderboard'
      let formRatingVal = 5;

      // Rule 6.1: saveData(newRecord)
      function saveData(newRecord) {
        const index = records.findIndex(r => r.id === newRecord.id);
        if (index !== -1) {
          records[index] = newRecord;
        } else {
          records.push(newRecord);
        }
        localStorage.setItem('records', JSON.stringify(records));
      }

      // Rule 6.2: loadData()
      function loadData() {
        const stored = localStorage.getItem('records');
        if (stored) {
          try {
            records = JSON.parse(stored);
          } catch (e) {
            console.error("Failed to parse records", e);
            records = [];
          }
        } else {
          // Initialize with cozy initial reviews to show high quality defaults
          records = getInitialValues();
          localStorage.setItem('records', JSON.stringify(records));
        }
        return records;
      }

      // Default high-quality initial Toy Story reviews
      function getInitialValues() {
        const now = Date.now();
        return [
          {
            id: (now - 3600000 * 2) + "_" + Math.random().toString(36).slice(2, 6),
            createdAt: new Date(now - 3600000 * 2).toISOString(),
            content: "安仔媽媽烤的草莓重乳酪蛋糕！咬下去滿嘴草莓果香與濃郁起司，美味程度直達外太空，太空騎警巴斯光年強力推薦！🚀🍇",
            category: "下午茶",
            rating: 5,
            votes: 12,
            status: "active",
            imageUrl: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=800&q=80"
          },
          {
            id: (now - 3600000 * 8) + "_" + Math.random().toString(36).slice(2, 6),
            createdAt: new Date(now - 3600000 * 8).toISOString(),
            content: "胡迪警長特製的德州炭烤牛肉堡，鮮嫩多汁的牛肉餅搭配煙燻燒烤醬，吃完感覺體內牛仔之魂熊熊燃燒！「我的靴子裡有蛇」已成為歷史，現在只有美味！🤠🍔",
            category: "晚餐",
            rating: 4,
            votes: 8,
            status: "active",
            imageUrl: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80"
          },
          {
            id: (now - 3600000 * 24) + "_" + Math.random().toString(36).slice(2, 6),
            createdAt: new Date(now - 3600000 * 24).toISOString(),
            content: "三眼怪漂浮抹茶歐蕾 💚 漂浮著可愛造型棉花糖，喝一口抹茶香甜溫潤，整個人都要被神秘之爪（THE CLAW）吸走啦！Ooooh! 👾🍵",
            category: "早餐",
            rating: 5,
            votes: 15,
            status: "done",
            imageUrl: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=800&q=80"
          }
        ];
      }

      // App Initializer Setup
      window.addEventListener('DOMContentLoaded', () => {
        loadData();
        setupFilters();
        setupFormSelects();
        renderStarPicker();
        renderList();
        lucide.createIcons();
      });

      // Simple time converter replicating distance-to-now
      function formatRelativeTime(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = now - date;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);
        const diffDays = Math.floor(diffHr / 24);

        if (diffSec < 60) return "剛剛";
        if (diffMin < 60) return `${diffMin} 分鐘前`;
        if (diffHr < 24) return `${diffHr} 小時前`;
        return `${diffDays} 天前`;
      }

      // Set filter header buttons
      function setupFilters() {
        // Category filters
        const catContainer = document.getElementById('category-filters');
        const categoriesHeader = ['全部', ...CATEGORIES];
        catContainer.innerHTML = categoriesHeader.map(cat => `
          <button
            onclick="setCategoryFilter('${cat}')"
            class="px-6 py-2.5 rounded-2xl text-xs font-black transition-all whitespace-nowrap border-b-4 shadow-md active:translate-y-1 active:border-b-0 cursor-pointer relative z-[60] pointer-events-auto ${
              currentCategoryFilter === cat 
                ? 'bg-yellow-400 text-red-600 border-red-600' 
                : 'bg-white text-blue-400 border-blue-200 hover:text-blue-600'
            }"
          >
            ${cat}
          </button>
        `).join('');

        // Status filters
        const statContainer = document.getElementById('status-filters');
        const statusHeader = [
          { key: '全部', label: '全部' },
          { key: 'active', label: 'Active (待評價)' },
          { key: 'done', label: 'Done (已評價)' }
        ];
        statContainer.innerHTML = statusHeader.map(stat => `
          <button
            onclick="setStatusFilter('${stat.key}')"
            class="px-6 py-2.5 rounded-2xl text-xs font-black transition-all whitespace-nowrap border-b-4 shadow-md active:translate-y-1 active:border-b-0 cursor-pointer relative z-[60] pointer-events-auto ${
              currentStatusFilter === stat.key 
                ? 'bg-yellow-400 text-red-600 border-red-600' 
                : 'bg-white text-blue-400 border-blue-200 hover:text-blue-600'
            }"
          >
            ${stat.label}
          </button>
        `).join('');
      }

      // Category inputs in form
      function setupFormSelects() {
        const select = document.getElementById('form-category');
        select.innerHTML = CATEGORIES.map(cat => `
          <option value="${cat}">${cat}</option>
        `).join('');
      }

      // Interactive Star feedback
      function renderStarPicker() {
        const starPicker = document.getElementById('star-picker');
        starPicker.innerHTML = [1, 2, 3, 4, 5].map(star => `
          <button
            type="button"
            onclick="setFormRating(${star})"
            class="focus:outline-none cursor-pointer"
          >
            <i
              data-lucide="star"
              class="w-7 h-7 form-picker-star transition-all transform hover:scale-125 active:scale-150 ${
                star <= formRatingVal 
                  ? 'text-yellow-400 fill-yellow-400 drop-shadow-[0_2px_4px_rgba(234,179,8,0.4)]' 
                  : 'text-blue-100'
              }"
            ></i>
          </button>
        `).join('');
        lucide.createIcons();
      }

      function setFormRating(val) {
        formRatingVal = val;
        renderStarPicker();
      }

      // Tab selector (Feed vs Leaderboard)
      function toggleTab() {
        activeTab = activeTab === 'feed' ? 'leaderboard' : 'feed';
        const docBtn = document.getElementById('tab-toggle-btn');
        const docBtnText = document.getElementById('tab-toggle-text');
        const formContainer = document.getElementById('form-container');
        const filtersContainer = document.getElementById('filters-container');
        const feedContainer = document.getElementById('feed-container');
        const leaderboardContainer = document.getElementById('leaderboard-container');

        if (activeTab === 'feed') {
          docBtnText.innerText = '🚀 飛向排行榜';
          formContainer.classList.remove('hidden');
          filtersContainer.classList.remove('hidden');
          feedContainer.classList.remove('hidden');
          leaderboardContainer.classList.add('hidden');
        } else {
          docBtnText.innerText = '🤠 回到警長辦公室';
          formContainer.classList.add('hidden');
          filtersContainer.classList.add('hidden');
          feedContainer.classList.add('hidden');
          leaderboardContainer.classList.remove('hidden');
        }
        renderList();
      }

      function setCategoryFilter(category) {
        currentCategoryFilter = category;
        setupFilters();
        renderList();
      }

      function setStatusFilter(status) {
        currentStatusFilter = status;
        setupFilters();
        renderList();
      }

      // Handles Form Submissions
      function handleFormSubmit(event) {
        event.preventDefault();
        const contentVal = document.getElementById('form-content').value.trim();
        const imageUrlVal = document.getElementById('form-image').value.trim();
        const categoryVal = document.getElementById('form-category').value;

        if (!contentVal) return;

        // Rule 4: Data Schema
        const newRecord = {
          id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
          createdAt: new Date().toISOString(),
          content: contentVal,
          category: categoryVal,
          rating: formRatingVal,
          votes: 0,
          status: 'active',
          imageUrl: imageUrlVal || null
        };

        saveData(newRecord);

        // ✅ 同步新增至 Google Sheet
        syncToSheet({ action: "create", record: newRecord });

        // Reset inputs
        document.getElementById('form-content').value = '';
        document.getElementById('form-image').value = '';
        formRatingVal = 5;
        renderStarPicker();

        // Banner success trigger
        const banner = document.getElementById('success-banner');
        banner.classList.remove('hidden');
        setTimeout(() => {
          banner.classList.add('hidden');
        }, 3000);

        // Reset Filter View and navigate to Feed view
        currentCategoryFilter = '全部';
        currentStatusFilter = '全部';
        setupFilters();
        renderList();

        // Scroll to feed top smoothly
        setTimeout(() => {
          window.scrollTo({ top: 400, behavior: 'smooth' });
        }, 100);
      }

      // Increments Votes
      function voteReview(id) {
        const record = records.find(r => r.id === id);
        if (record) {
          record.votes = (record.votes || 0) + 1;
          saveData(record);

          // ✅ 同步投票更新至 Google Sheet
          syncToSheet({ action: "update", id: record.id, changes: { votes: record.votes } });

          renderList();
        }
      }

      // Change Active <-> Done
      function toggleReviewStatus(id, currentStatus) {
        const record = records.find(r => r.id === id);
        if (record) {
          record.status = currentStatus === 'active' ? 'done' : 'active';
          saveData(record);

          // ✅ 同步狀態切換至 Google Sheet
          syncToSheet({ action: "update", id: record.id, changes: { status: record.status } });

          renderList();
        }
      }

      // Rule 6.3: renderList() Handles all display logic (Sorting + Filtering + Render)
      function renderList() {
        if (activeTab === 'feed') {
          // 1. Filter
          let filtered = [...records];
          if (currentCategoryFilter !== '全部') {
            filtered = filtered.filter(item => item.category === currentCategoryFilter);
          }
          if (currentStatusFilter !== '全部') {
            filtered = filtered.filter(item => item.status === currentStatusFilter);
          }

          // 2. Partition and Sort: Active first, Done last, sorted by createdAt descending
          const activeList = filtered.filter(i => i.status !== 'done').sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          const doneList = filtered.filter(i => i.status === 'done').sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

          const container = document.getElementById('feed-container');

          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="py-20 text-center space-y-6">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto border-4 border-yellow-400 shadow-xl relative">
                  <i data-lucide="utensils" class="text-red-500 w-12 h-12"></i>
                  <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-lime-400 rounded-full border-2 border-white flex items-center justify-center">
                     <i data-lucide="star" class="text-white w-6 h-6 fill-white"></i>
                  </div>
                </div>
                <div class="space-y-2">
                  <p class="text-blue-900 font-black text-xl">「我的靴子裡有蛇！」</p>
                  <p class="text-blue-600 text-sm font-bold italic">暫時沒有食評，快來分享第一個吧！</p>
                </div>
              </div>
            `;
            lucide.createIcons();
            return;
          }

          let htmlContent = '';

          // Render Active items
          activeList.forEach(review => {
            htmlContent += getCardHTML(review);
          });

          // Render divider if '全部' status filter and done list is present
          if (doneList.length > 0 && currentStatusFilter === '全部') {
            htmlContent += `
              <div class="py-4 flex items-center gap-4">
                <div class="h-1 flex-1 bg-gray-200 rounded-full"></div>
                <span class="text-xs font-black text-gray-400 uppercase tracking-widest">已完成的冒險紀錄 (${doneList.length})</span>
                <div class="h-1 flex-1 bg-gray-200 rounded-full"></div>
              </div>
            `;
          }

          // Render Done items
          doneList.forEach(review => {
            htmlContent += getCardHTML(review);
          });

          container.innerHTML = htmlContent;

        } else if (activeTab === 'leaderboard') {
          // Leaderboard top 10 sorted by votes decending
          const sorted = [...records].sort((a, b) => {
            const votesDiff = (b.votes || 0) - (a.votes || 0);
            if (votesDiff !== 0) return votesDiff;
            return new Date(b.createdAt) - new Date(a.createdAt);
          }).slice(0, 10);

          const container = document.getElementById('leaderboard-container');
          container.innerHTML = `
            <h2 class="text-2xl font-toy text-yellow-400 mb-6 flex items-center gap-3">
              <i data-lucide="thumbs-up" class="w-8 h-8 text-red-500"></i>
              人氣排行榜
            </h2>
            <div class="space-y-4">
              ${sorted.map((review, index) => getLeaderboardItemHTML(review, index)).join('')}
            </div>
          `;
        }
        lucide.createIcons();
      }

      // Element Template Card View generator
      function getCardHTML(review) {
        const isDone = review.status === 'done';
        const ratingStars = Array.from({ length: 5 }, (_, i) => `
          <i
            data-lucide="star"
            class="w-5 h-5 ${i < review.rating ? 'text-yellow-400 fill-yellow-400 drop-shadow-[0_2px_4px_rgba(234,179,8,0.3)]' : 'text-blue-50'}"
          ></i>
        `).join('');

        const statusBadgeStyle = isDone 
          ? 'bg-gray-200 text-gray-500 border-gray-300' 
          : 'bg-yellow-400 text-red-600 border-red-500';

        const cardStyle = isDone 
          ? 'border-gray-100 bg-gray-50/30' 
          : 'border-blue-100 hover:border-yellow-400';

        const imageHTML = review.imageUrl ? `
          <div class="mb-6 rounded-[2rem] overflow-hidden border-[6px] border-blue-50 shadow-inner group-hover:shadow-2xl transition-all duration-500">
            <img 
              src="${review.imageUrl}" 
              alt="Food" 
              class="w-full h-64 object-cover group-hover:scale-110 transition-transform duration-1000"
              referrerpolicy="no-referrer"
              onerror="this.style.display='none'"
            />
          </div>
        ` : '';

        const voteButtonStyle = isDone 
          ? 'bg-gray-50 text-gray-400 border-gray-200' 
          : 'bg-blue-50/80 text-blue-400 hover:text-red-500 border-blue-200';

        const toggleButtonStyle = isDone 
          ? 'bg-lime-500 text-white border-lime-700 hover:bg-red-500 hover:border-red-700' 
          : 'bg-white text-gray-500 border-gray-200 hover:bg-lime-50 text-lime-600 hover:border-lime-200';

        const toggleButtonContent = isDone 
          ? `<i data-lucide="check-circle" class="w-5 h-5"></i><span>切換為 Active</span>` 
          : `<i data-lucide="circle" class="w-5 h-5"></i><span>切換為 Done</span>`;

        return `
          <div class="group bg-white border-[6px] ${cardStyle} rounded-[2.5rem] p-7 transition-all shadow-[0_15px_40px_rgba(0,0,0,0.1)] relative overflow-hidden">
            <!-- Status Badge -->
            <div class="absolute top-0 left-0 px-4 py-1.5 rounded-br-2xl text-[10px] font-black uppercase tracking-widest z-20 border-b-2 border-r-2 ${statusBadgeStyle}">
              Status: ${review.status}
            </div>

            <!-- Alien themed accent -->
            <div class="absolute -top-4 -right-4 w-20 h-20 bg-lime-400 rounded-full opacity-20 flex items-center justify-center rotate-12 border-4 border-lime-600">
              <div class="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
              <div class="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
              <div class="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
            </div>

            <div class="flex justify-between items-start mb-5 pt-4">
              <div class="flex items-center gap-3">
                <span class="px-4 py-1.5 bg-blue-600 text-white text-xs font-black uppercase tracking-widest rounded-2xl border-b-4 border-blue-800 shadow-sm">
                  ${review.category}
                </span>
                <div class="flex gap-1">
                  ${ratingStars}
                </div>
              </div>
              <span class="text-xs text-blue-300 font-black flex items-center gap-1.5 bg-blue-50/50 px-3 py-1 rounded-full">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                ${formatRelativeTime(review.createdAt)}
              </span>
            </div>

            ${imageHTML}

            <p class="text-blue-900 text-lg font-bold leading-relaxed mb-8 whitespace-pre-wrap px-2">
              ${review.content}
            </p>

            <div class="flex items-center justify-between pt-6 border-t-4 border-blue-50/50">
              <div class="flex items-center gap-3">
                <button 
                  onclick="voteReview('${review.id}')"
                  class="flex items-center gap-3 transition-all group/vote px-6 py-3 rounded-[1.5rem] border-b-4 active:translate-y-1 active:border-b-0 shadow-sm hover:shadow-md cursor-pointer ${voteButtonStyle}"
                >
                  <i data-lucide="thumbs-up" class="w-6 h-6 group-hover/vote:scale-125 group-hover/vote:-rotate-12 transition-all"></i>
                  <span class="text-base font-black">${review.votes || 0}</span>
                </button>

                <button
                  onclick="toggleReviewStatus('${review.id}', '${review.status}')"
                  class="flex items-center gap-2 px-5 py-3 rounded-[1.5rem] border-b-4 text-xs font-black transition-all active:translate-y-1 active:border-b-0 shadow-sm hover:shadow-md cursor-pointer ${toggleButtonStyle}"
                >
                  ${toggleButtonContent}
                </button>
              </div>
              <div class="flex items-center gap-2 text-lime-600 font-black italic bg-lime-50 px-4 py-2 rounded-2xl border-2 border-lime-100">
                <div class="flex -space-x-1.5">
                  <div class="w-3 h-3 bg-lime-500 rounded-full border-2 border-white shadow-sm"></div>
                  <div class="w-3 h-3 bg-lime-500 rounded-full border-2 border-white shadow-sm"></div>
                  <div class="w-3 h-3 bg-lime-500 rounded-full border-2 border-white shadow-sm"></div>
                </div>
                <span class="text-xs uppercase tracking-tighter">Ooooh! 匿名隊友</span>
              </div>
            </div>
          </div>
        `;
      }

      // Leaderboard template builder
      function getLeaderboardItemHTML(review, index) {
        const ratingStars = Array.from({ length: 5 }, (_, i) => `
          <i data-lucide="star" class="w-3 h-3 ${i < review.rating ? 'text-yellow-400 fill-yellow-400' : 'text-blue-100'}"></i>
        `).join('');

        const isDone = review.status === 'done';

        let badgeStyle = "bg-blue-100 text-blue-400 border-blue-200";
        if (index === 0) badgeStyle = "bg-yellow-400 text-red-600 border-red-500";
        else if (index === 1) badgeStyle = "bg-neutral-200 text-blue-800 border-blue-400";
        else if (index === 2) badgeStyle = "bg-orange-400 text-white border-orange-600";

        const statusTagStyle = isDone 
          ? "bg-gray-100 text-gray-400" 
          : "bg-yellow-100 text-red-500";

        return `
          <div class="flex items-center gap-4 bg-white/80 border-4 border-blue-200 p-5 rounded-3xl shadow-lg">
            <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-lg shrink-0 border-2 ${badgeStyle}">
              ${index + 1}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                 <p class="text-base font-black text-blue-900 truncate">${review.content}</p>
                 <span class="px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-tighter shrink-0 ${statusTagStyle}">
                   ${review.status}
                 </span>
              </div>
              <div class="flex items-center gap-2 mt-1">
                <span class="px-2 py-0.5 bg-lime-100 text-lime-700 text-[10px] font-black rounded-full border border-lime-200">${review.category}</span>
                <div class="flex gap-0.5">
                  ${ratingStars}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1 text-red-500 font-black text-xl">
              <i data-lucide="thumbs-up" class="w-5 h-5"></i>
              <span>${review.votes || 0}</span>
            </div>
          </div>
        `;
      }
    </script>
  </body>
</html>
