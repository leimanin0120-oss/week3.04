<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具美食評分</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/locale/zh-TW/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/clsx@2.1.1/dist/clsx.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      background-color: #FFF9E6;
      background-image: radial-gradient(circle, #FFE066 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .font-toy { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; letter-spacing: 0.05em; }
    .buzz-space {
      background: linear-gradient(135deg, #4C1D95, #7C3AED, #6D28D9);
    }
    .cow-print {
      background-color: #FFFFFF;
      background-image: radial-gradient(#1F2937 15%, transparent 16%),
                        radial-gradient(#1F2937 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createElement, forwardRef } = React;
    const { motion, AnimatePresence } = window.Motion || {};

    // ==================== 請貼上你部署後的 Apps Script 網址 ====================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQImSKW3hfcVFzZT4zK6yD5uuhaCMkPHZzLuHxoktBio-04tSLTsW9dUbzbm3Bz95w/exec";
    // ========================================================================

    // ---------- Utility ----------
    function cn(...inputs) {
      return inputs.filter(Boolean).join(' ');
    }

    // ---------- Types ----------
    const CATEGORIES = ['早餐', '午餐', '下午茶', '晚餐', '其他'];

    // ---------- localStorage Keys ----------
    const STORAGE_KEY = 'toy_food_reviews';

    // ---------- Helpers ----------
    function generateId() {
      return Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.warn('Failed to load from localStorage', e);
        return [];
      }
    }

    function saveToStorage(reviews) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
      } catch (e) {
        console.warn('Failed to save to localStorage', e);
      }
    }

    // ---------- Google Sheets Sync ----------
    async function syncToSheet(payload) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
        console.warn('APPS_SCRIPT_URL not set, skipping sync to Google Sheets');
        return;
      }
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        console.log('Synced to Google Sheets:', result);
      } catch (err) {
        console.warn('Failed to sync to Google Sheets, will retry on next change', err);
      }
    }

    // ---------- Main App ----------
    function App() {
      const [reviews, setReviews] = useState([]);
      const [filter, setFilter] = useState('全部');
      const [statusFilter, setStatusFilter] = useState('全部');
      const [showForm, setShowForm] = useState(true);
      const [newReview, setNewReview] = useState({
        content: '',
        category: '早餐',
        rating: 5,
        imageUrl: ''
      });
      const [activeTab, setActiveTab] = useState('feed');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [hasLoaded, setHasLoaded] = useState(false);
      const [showSuccess, setShowSuccess] = useState(false);
      const [formKey, setFormKey] = useState(0);

      // 初始化時從 localStorage 載入資料
      useEffect(() => {
        const stored = loadFromStorage();
        setReviews(stored);
        setHasLoaded(true);
      }, []);

      // 過濾邏輯
      const filteredReviews = useMemo(() => {
        let result = reviews;
        if (filter !== '全部') {
          result = result.filter(r => r.category === filter);
        }
        if (statusFilter !== '全部') {
          result = result.filter(r => r.status === statusFilter);
        }
        return result;
      }, [reviews, filter, statusFilter]);

      // 排序：active 在前，done 在後；同狀態按時間新到舊
      const sortedFiltered = useMemo(() => {
        return [...filteredReviews].sort((a, b) => {
          const statusOrderA = a.status === 'done' ? 1 : 0;
          const statusOrderB = b.status === 'done' ? 1 : 0;
          if (statusOrderA !== statusOrderB) return statusOrderA - statusOrderB;
          return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
        });
      }, [filteredReviews]);

      const activeReviews = useMemo(() => sortedFiltered.filter(r => r.status !== 'done'), [sortedFiltered]);
      const doneReviews = useMemo(() => sortedFiltered.filter(r => r.status === 'done'), [sortedFiltered]);

      const feedItems = useMemo(() => {
        const items = [];
        activeReviews.forEach(r => items.push({ type: 'review', review: r, id: r.id }));
        if (doneReviews.length > 0 && statusFilter === '全部') {
          items.push({ type: 'divider', id: 'divider-done', count: doneReviews.length });
        }
        doneReviews.forEach(r => items.push({ type: 'review', review: r, id: r.id }));
        return items;
      }, [activeReviews, doneReviews, statusFilter]);

      const leaderboard = useMemo(() => {
        return [...reviews].sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 10);
      }, [reviews]);

      // ---------- CREATE ----------
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!newReview.content.trim() || isSubmitting) return;

        setIsSubmitting(true);
        try {
          const newRecord = {
            id: generateId(),
            content: newReview.content,
            category: newReview.category,
            rating: newReview.rating,
            votes: 0,
            status: 'active',
            imageUrl: newReview.imageUrl || null,
            createdAt: new Date().toISOString()
          };

          // 1. 更新 state + localStorage
          const updatedReviews = [newRecord, ...reviews];
          setReviews(updatedReviews);
          saveToStorage(updatedReviews);

          // 2. 同步到 Google Sheets
          syncToSheet({ action: 'create', record: newRecord });

          // Reset form
          setNewReview({ content: '', category: '早餐', rating: 5, imageUrl: '' });
          setFormKey(prev => prev + 1);
          setFilter('全部');
          setActiveTab('feed');
          setShowSuccess(true);
          setTimeout(() => setShowSuccess(false), 3000);
          setTimeout(() => window.scrollTo({ top: 400, behavior: 'smooth' }), 100);
        } catch (err) {
          console.error('Submit failed', err);
          alert('發布失敗，請稍後再試。');
        } finally {
          setIsSubmitting(false);
        }
      };

      // ---------- VOTE (UPDATE) ----------
      const handleVote = (id) => {
        setReviews(prev => {
          const updated = prev.map(r => {
            if (r.id === id) {
              const newVotes = (r.votes || 0) + 1;
              return { ...r, votes: newVotes };
            }
            return r;
          });
          saveToStorage(updated);

          // 同步到 Google Sheets
          const changed = updated.find(r => r.id === id);
          if (changed) {
            syncToSheet({ action: 'update', id: id, changes: { votes: changed.votes } });
          }
          return updated;
        });
      };

      // ---------- TOGGLE STATUS (UPDATE) ----------
      const handleToggleStatus = (id, currentStatus) => {
        setReviews(prev => {
          const newStatus = currentStatus === 'active' ? 'done' : 'active';
          const updated = prev.map(r => {
            if (r.id === id) {
              return { ...r, status: newStatus };
            }
            return r;
          });
          saveToStorage(updated);

          // 同步到 Google Sheets
          syncToSheet({ action: 'update', id: id, changes: { status: newStatus } });
          return updated;
        });
      };

      // ==================== JSX (UI 完全保留) ====================
      return (
        <div className="min-h-screen text-blue-900 font-sans selection:bg-yellow-400/30">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-white border-b-4 border-yellow-400 shadow-md">
            <div className="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between relative z-50">
              <div className="flex items-center gap-2">
                <div className="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-lg border-2 border-red-500 overflow-hidden relative">
                  <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 10px, #EF4444 10px, #EF4444 11px)' }}></div>
                  <i data-lucide="utensils" className="text-red-600 w-7 h-7 relative z-10"></i>
                </div>
                <div>
                  <h1 className="text-2xl font-toy text-yellow-400 tracking-wider">玩具美食評分</h1>
                  <p className="text-[10px] text-blue-800 font-black uppercase tracking-[0.2em]">Toy Story Food Rating</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setActiveTab(activeTab === 'feed' ? 'leaderboard' : 'feed')}
                  className="px-4 py-2 rounded-xl buzz-space text-white text-xs font-black border-b-4 border-purple-900 hover:brightness-110 transition-all active:translate-y-1 active:border-b-0 shadow-lg overflow-hidden cursor-pointer"
                >
                  <span className="relative z-10">{activeTab === 'feed' ? '🚀 飛向排行榜' : '🤠 回到警長辦公室'}</span>
                </button>
              </div>
            </div>

            {activeTab === 'feed' && (
              <div className="max-w-2xl mx-auto px-4 pb-4 space-y-3 relative z-50">
                <div className="overflow-x-auto no-scrollbar">
                  <div className="flex gap-2 py-1 pointer-events-auto">
                    <FilterButton active={filter === '全部'} onClick={() => setFilter('全部')} label="全部" />
                    {CATEGORIES.map(cat => (
                      <FilterButton key={cat} active={filter === cat} onClick={() => setFilter(cat)} label={cat} />
                    ))}
                  </div>
                </div>
                <div className="flex gap-2 py-1 border-t-2 border-blue-50 pt-3 items-center">
                  <span className="text-[10px] font-black text-blue-200 uppercase tracking-widest mr-1">Status:</span>
                  <FilterButton active={statusFilter === '全部'} onClick={() => setStatusFilter('全部')} label="全部" />
                  <FilterButton active={statusFilter === 'active'} onClick={() => setStatusFilter('active')} label="Active (待評價)" />
                  <FilterButton active={statusFilter === 'done'} onClick={() => setStatusFilter('done')} label="Done (已評價)" />
                </div>
              </div>
            )}
          </header>

          <main className="max-w-2xl mx-auto px-4 py-6 pb-24 relative z-10">
            {activeTab === 'feed' && (
              <div className="mb-8 relative z-20">
                <form key={formKey} onSubmit={handleSubmit} className="bg-white border-8 border-yellow-400 rounded-[2.5rem] p-8 space-y-6 shadow-[0_20px_50px_rgba(0,0,0,0.2)] relative overflow-hidden">
                  <div className="absolute -top-10 -right-10 w-40 h-40 cow-print opacity-20 rotate-12 rounded-full border-4 border-black"></div>
                  <div className="flex items-center gap-3 mb-2">
                    <div className="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center border-b-4 border-red-700">
                      <i data-lucide="message-square" className="text-white w-5 h-5"></i>
                    </div>
                    <h2 className="text-xl font-toy text-blue-900 tracking-tight">新增你的冒險食評！</h2>
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">你的冒險心得</label>
                    <textarea
                      value={newReview.content}
                      onChange={(e) => setNewReview({ ...newReview, content: e.target.value })}
                      placeholder="這頓飯太好吃了！就像飛向宇宙，浩瀚無垠！"
                      className="w-full bg-blue-50/50 border-4 border-blue-100 rounded-3xl p-5 text-base focus:ring-8 focus:ring-yellow-400/30 min-h-[120px] resize-none placeholder:text-blue-200 text-blue-900 outline-none transition-all font-medium"
                      required
                    />
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">捕捉美味瞬間 (圖片網址)</label>
                    <div className="relative">
                      <input
                        type="url"
                        value={newReview.imageUrl}
                        onChange={(e) => setNewReview({ ...newReview, imageUrl: e.target.value })}
                        placeholder="https://example.com/food.jpg"
                        className="w-full bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-5 py-4 text-sm focus:ring-8 focus:ring-yellow-400/30 text-blue-900 outline-none transition-all"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-6">
                    <div className="space-y-2">
                      <label className="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">任務分類</label>
                      <div className="relative">
                        <select
                          value={newReview.category}
                          onChange={(e) => setNewReview({ ...newReview, category: e.target.value })}
                          className="w-full bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-5 py-4 text-sm appearance-none focus:ring-8 focus:ring-yellow-400/30 text-blue-900 outline-none font-black"
                        >
                          {CATEGORIES.map(cat => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                        <i data-lucide="chevron-down" className="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-500 pointer-events-none"></i>
                      </div>
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-black text-blue-400 uppercase tracking-[0.2em] ml-2">星級評價</label>
                      <div className="flex items-center justify-around bg-blue-50/50 border-4 border-blue-100 rounded-2xl px-4 py-3">
                        {[1, 2, 3, 4, 5].map(star => (
                          <button
                            key={star}
                            type="button"
                            onClick={() => setNewReview({ ...newReview, rating: star })}
                            className="focus:outline-none cursor-pointer"
                          >
                            <svg 
                              className={cn(
                                "w-7 h-7 transition-all transform hover:scale-125 active:scale-150",
                                star <= newReview.rating ? "text-yellow-400 fill-yellow-400 drop-shadow-[0_2px_4px_rgba(234,179,8,0.4)]" : "text-blue-100"
                              )}
                              viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1"
                            >
                              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full bg-red-500 hover:bg-red-400 disabled:opacity-50 text-white font-black text-lg py-5 rounded-3xl flex items-center justify-center gap-3 transition-all border-b-[6px] border-red-700 active:translate-y-1 active:border-b-0 shadow-[0_10px_20px_rgba(239,68,68,0.3)] group cursor-pointer"
                  >
                    {isSubmitting ? '正在傳送至總部...' : (
                      <>
                        <i data-lucide="send" className="w-6 h-6 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                        <span>發布食評！(飛向宇宙！)</span>
                      </>
                    )}
                  </button>

                  {showSuccess && (
                    <div className="bg-lime-100 border-4 border-lime-500 text-lime-700 p-4 rounded-2xl flex items-center gap-3 font-black text-sm">
                      <div className="w-8 h-8 bg-lime-500 rounded-full flex items-center justify-center text-white shrink-0">✓</div>
                      任務成功！食評已永久保存在安仔的房間！🚀
                    </div>
                  )}
                </form>
              </div>
            )}

            {activeTab === 'feed' ? (
              <div className="space-y-6 relative z-10">
                {!hasLoaded ? (
                  <div className="py-20 text-center">
                    <div className="w-16 h-16 border-4 border-yellow-400 border-t-red-500 rounded-full animate-spin mx-auto shadow-lg"></div>
                    <p className="mt-4 text-blue-600 font-black animate-pulse">正在從安仔的房間讀取數據...</p>
                  </div>
                ) : filteredReviews.length > 0 ? (
                  feedItems.map((item) => {
                    if (item.type === 'divider') {
                      return (
                        <div key={item.id} className="py-4 flex items-center gap-4">
                          <div className="h-1 flex-1 bg-gray-200 rounded-full"></div>
                          <span className="text-xs font-black text-gray-400 uppercase tracking-widest">已完成的冒險紀錄 ({item.count})</span>
                          <div className="h-1 flex-1 bg-gray-200 rounded-full"></div>
                        </div>
                      );
                    }
                    return (
                      <ReviewCard 
                        key={item.id} 
                        review={item.review} 
                        onVote={handleVote} 
                        onToggleStatus={handleToggleStatus}
                      />
                    );
                  })
                ) : (
                  <EmptyState />
                )}
              </div>
            ) : (
              <div className="space-y-4">
                <h2 className="text-2xl font-toy text-yellow-400 mb-6 flex items-center gap-3">
                  <i data-lucide="thumbs-up" className="w-8 h-8 text-red-500"></i>
                  人氣排行榜
                </h2>
                <div className="space-y-4">
                  {leaderboard.map((review, index) => (
                    <div
                      key={review.id}
                      className="flex items-center gap-4 bg-white/80 border-4 border-blue-200 p-5 rounded-3xl shadow-lg"
                    >
                      <div className={cn(
                        "w-10 h-10 rounded-full flex items-center justify-center font-black text-lg shrink-0 border-2",
                        index === 0 ? "bg-yellow-400 text-red-600 border-red-500" : 
                        index === 1 ? "bg-neutral-200 text-blue-800 border-blue-400" :
                        index === 2 ? "bg-orange-400 text-white border-orange-600" : "bg-blue-100 text-blue-400 border-blue-200"
                      )}>
                        {index + 1}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <p className="text-base font-black text-blue-900 truncate">{review.content}</p>
                          <span className={cn(
                            "px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-tighter shrink-0",
                            review.status === 'done' ? "bg-gray-100 text-gray-400" : "bg-yellow-100 text-red-500"
                          )}>
                            {review.status}
                          </span>
                        </div>
                        <div className="flex items-center gap-2 mt-1">
                          <span className="px-2 py-0.5 bg-lime-100 text-lime-700 text-[10px] font-black rounded-full border border-lime-200">{review.category}</span>
                          <div className="flex gap-0.5">
                            {[...Array(5)].map((_, i) => (
                              <svg key={i} className={cn("w-3 h-3", i < review.rating ? "text-yellow-400 fill-yellow-400" : "text-blue-100")} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                              </svg>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-1 text-red-500 font-black text-xl">
                        <i data-lucide="thumbs-up" className="w-5 h-5"></i>
                        <span>{review.votes}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // ---------- ReviewCard Component ----------
    function ReviewCard({ review, onVote, onToggleStatus }) {
      const isDone = review.status === 'done';
      const timeAgo = (() => {
        try {
          if (review.createdAt && window.dateFns) {
            return window.dateFns.formatDistanceToNow(new Date(review.createdAt), { addSuffix: true, locale: window.dateFns.locale?.zhTW });
          }
        } catch (e) {}
        return '剛剛';
      })();

      return (
        <div
          className={cn(
            "group bg-white border-[6px] rounded-[2.5rem] p-7 transition-all shadow-[0_15px_40px_rgba(0,0,0,0.1)] relative overflow-hidden",
            isDone ? "border-gray-100 bg-gray-50/30" : "border-blue-100 hover:border-yellow-400"
          )}
        >
          <div className={cn(
            "absolute top-0 left-0 px-4 py-1.5 rounded-br-2xl text-[10px] font-black uppercase tracking-widest z-20 border-b-2 border-r-2",
            isDone ? "bg-gray-200 text-gray-500 border-gray-300" : "bg-yellow-400 text-red-600 border-red-500"
          )}>
            Status: {review.status}
          </div>

          <div className="absolute -top-4 -right-4 w-20 h-20 bg-lime-400 rounded-full opacity-20 flex items-center justify-center rotate-12 border-4 border-lime-600">
            <div className="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
            <div className="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
            <div className="w-3 h-3 bg-white rounded-full mx-1 shadow-sm"></div>
          </div>

          <div className="flex justify-between items-start mb-5">
            <div className="flex items-center gap-3">
              <span className="px-4 py-1.5 bg-blue-600 text-white text-xs font-black uppercase tracking-widest rounded-2xl border-b-4 border-blue-800 shadow-sm">
                {review.category}
              </span>
              <div className="flex gap-1">
                {[...Array(5)].map((_, i) => (
                  <svg 
                    key={i} 
                    className={cn(
